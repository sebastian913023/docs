<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Trading Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
/* BEM blocks: desk, banner, tabs, tiles, panel, horizon, kv, meter, table, chart, timeline, status, button, label */
:root{
  --bg:#0c1118; --panel:#131a24; --panel2:#18212d; --line:#263243; --fg:#e6ebf2; --mut:#8c99ab; --dim:#5d6a7c;
  --accent:#6aa7d8; --up:#38c79a; --dn:#f0647a; --warn:#e3b341;
  --up-bg:#38c79a1f; --dn-bg:#f0647a1f; --warn-bg:#e3b3411f; --accent-bg:#6aa7d81f;
  --f-sans:"IBM Plex Sans",system-ui,sans-serif; --f-cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f3f5f8; --panel:#fff; --panel2:#eef1f5; --line:#d5dbe4; --fg:#16202c; --mut:#566275; --dim:#7f8a9b;
  --accent:#1f6fae; --up:#0f8a63; --dn:#c7334b; --warn:#a97a00;
  --up-bg:#0f8a6317; --dn-bg:#c7334b17; --warn-bg:#a97a0017; --accent-bg:#1f6fae14; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f3f5f8; --panel:#fff; --panel2:#eef1f5; --line:#d5dbe4; --fg:#16202c; --mut:#566275; --dim:#7f8a9b;
  --accent:#1f6fae; --up:#0f8a63; --dn:#c7334b; --warn:#a97a00;
  --up-bg:#0f8a6317; --dn-bg:#c7334b17; --warn-bg:#a97a0017; --accent-bg:#1f6fae14; color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-sans);padding:16px 16px 40px}
.desk{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.desk__header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.desk__title{margin:0;font:600 20px/1.2 var(--f-cond);letter-spacing:.01em}
.desk__sub{color:var(--mut);font-size:12px}
.desk__controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.desk__grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.label{font:600 11px/1 var(--f-cond);letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.label--spaced{display:block;margin:12px 0 6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:500 12px var(--f-sans);cursor:pointer}
.button:hover{border-color:var(--accent)}
.banner{border:1px solid var(--warn);background:var(--warn-bg);border-radius:8px;padding:10px 12px;font-size:13px}
.banner--info{border-color:var(--line);background:var(--panel)}
.banner__list{margin:4px 0 0;padding-left:18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs__tab{background:var(--panel);border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:5px 12px;font:500 12px var(--f-sans);cursor:pointer}
.tabs__tab--active{color:var(--fg);border-color:var(--accent);background:var(--accent-bg)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.panel__head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.panel__title{margin:0;font:600 14px var(--f-cond);letter-spacing:.03em}
.panel__note{color:var(--dim);font-size:12px;margin:8px 0 0}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.tiles__tile{background:var(--panel2);border-radius:8px;padding:10px}
.tiles__value{font:600 18px/1.3 var(--f-mono);margin-top:6px;font-variant-numeric:tabular-nums}
.tiles__value--up{color:var(--up)} .tiles__value--dn{color:var(--dn)}
.horizon__action{font:600 26px/1 var(--f-cond);letter-spacing:.04em}
.horizon__action--CALL{color:var(--up)} .horizon__action--PUT{color:var(--dn)} .horizon__action--ABSTAIN{color:var(--mut)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kv:last-child{border-bottom:0}
.horizon__reasons{margin:8px 0 0;padding-left:18px;color:var(--warn);font-size:12px}
.horizon__strength{margin-top:10px}
.meter{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:4px}
.meter__fill{height:100%;background:var(--accent)}
.meter__caption{font-size:11px;color:var(--dim)}
.status{display:inline-block;border-radius:4px;padding:2px 6px;font:600 11px var(--f-mono);border:1px solid var(--line)}
.status--ok{color:var(--up);border-color:var(--up);background:var(--up-bg)}
.status--bad{color:var(--dn);border-color:var(--dn);background:var(--dn-bg)}
.status--warn{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.table-wrap{overflow-x:auto}
.table{width:100%;border-collapse:collapse;font-size:12px}
.table__cell{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.table__cell--head{color:var(--mut);font:600 11px var(--f-cond);letter-spacing:.06em;text-transform:uppercase}
.table__cell--num{text-align:right;font-family:var(--f-mono)}
.chart{width:100%;height:180px;display:block}
.chart__line{fill:none;stroke:var(--accent);stroke-width:1.6}
.chart__base{stroke:var(--dim);stroke-dasharray:3 3}
.chart__text{fill:var(--mut);font:11px var(--f-mono)}
.timeline{list-style:none;margin:0;padding:0;font-size:12px;max-height:200px;overflow:auto}
.timeline__item{padding:4px 0;border-bottom:1px solid var(--line)}
.empty{color:var(--dim);font-size:13px}
</style>
</head>
<body>
<main class="desk">
  <header class="desk__header">
    <div>
      <h1 class="desk__title">Paper Trading Desk · 3 / 5 / 15 min</h1>
      <div class="desk__sub" id="sub">Load <span class="mono">state.json</span> produced by <span class="mono">python -m paperdesk.cli demo</span></div>
    </div>
    <div class="desk__controls">
      <input type="file" id="file" accept=".json" hidden>
      <button class="button" id="load">Load state.json</button>
      <button class="button" id="theme">Theme</button>
    </div>
  </header>
  <div class="banner" id="honesty">PAPER ONLY — no real-money orders can be sent. Nothing loaded yet.</div>
  <nav class="tabs" id="tabs"></nav>
  <div id="run"></div>
  <section class="panel" id="quantum"></section>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "—").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = (v, d = 2) => v === null || v === undefined ? "—" : Number(v).toLocaleString(undefined, {minimumFractionDigits: d, maximumFractionDigits: d});
const pct = v => v === null || v === undefined ? "—" : (100 * v).toFixed(1) + "%";
const okCls = s => /VALIDATED|^OK$|COMPLETED|VERIFIED/.test(s) ? "status--ok" : /REJECTED|INVALID|FAILED|STALE/.test(s) ? "status--bad" : "status--warn";
const badge = s => `<span class="status ${okCls(String(s))}">${esc(s)}</span>`;
let STATE = null, RUN = 0;

function table(head, rows, numCols = []) {
  return `<div class="table-wrap"><table class="table"><tr>${head.map((h, i) => `<th class="table__cell table__cell--head${numCols.includes(i) ? " table__cell--num" : ""}">${esc(h)}</th>`).join("")}</tr>${
    rows.map(r => `<tr>${r.map((c, i) => `<td class="table__cell${numCols.includes(i) ? " table__cell--num" : ""}">${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
}

function curve(points, base) {
  if (!points.length) return `<p class="empty">No settled contracts yet: the settlement-based equity curve is empty.</p>`;
  const ys = points.map(p => p[1]).concat([base]), lo = Math.min(...ys), hi = Math.max(...ys), W = 600, H = 180, pad = 24;
  const x = i => pad + (W - 2 * pad) * (points.length === 1 ? 0.5 : i / (points.length - 1));
  const y = v => H - pad - (H - 2 * pad) * (hi === lo ? 0.5 : (v - lo) / (hi - lo));
  const d = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Settlement-based equity curve">
    <line class="chart__base" x1="${pad}" x2="${W - pad}" y1="${y(base)}" y2="${y(base)}"/><path class="chart__line" d="${d}"/>
    <text class="chart__text" x="${pad}" y="14">${num(hi)}</text><text class="chart__text" x="${pad}" y="${H - 6}">${num(lo)}</text></svg>`;
}

function horizon(h, d) {
  if (!d) return `<section class="panel"><h2 class="panel__title">${h}-minute</h2><p class="empty">No decision.</p></section>`;
  const ss = d.signal_strength, pay = d.payout_available_at_decision;
  const contrib = ss ? Object.entries(ss.contributions).map(([k, v]) =>
    `<div class="kv"><span>${esc(k.toUpperCase())}</span><span class="mono">${typeof v === "string" ? esc(v) : `c=${num(v.component, 3)} · w=${v.weight} · ${num(v.weighted, 3)}`}</span></div>`).join("") : "";
  const unc = d.probability_uncertainty ? `[${d.probability_uncertainty.interval.map(v => num(v, 3)).join(", ")}] n=${d.probability_uncertainty.bin_n}` : "null (not reliably estimable)";
  return `<section class="panel horizon">
    <div class="panel__head"><h2 class="panel__title">${h}-minute horizon</h2><span class="label">${esc(d.decision_time_utc)}</span></div>
    <div class="horizon__action horizon__action--${esc(d.action)}">${esc(d.action)}</div>
    <div class="kv"><span>Calibrated p(win)</span><span class="mono">${d.calibrated_p_win === null ? "— not available" : num(d.calibrated_p_win, 3) + " " + esc(d.calibrated_direction)}</span></div>
    <div class="kv"><span>Uncertainty</span><span class="mono">${esc(unc)}</span></div>
    <div class="kv"><span>Validation</span>${badge(d.validation_status)}</div>
    <div class="kv"><span>Data quality</span>${badge(d.data_quality_status)}</div>
    <div class="kv"><span>Payout at decision</span><span class="mono">${pay ? num(pay.payout_ratio, 2) + " · " + esc(pay.source) : "none"}</span></div>
    <div class="kv"><span>Expected net payoff / $1</span><span class="mono">${num(d.expected_net_payoff_per_dollar, 4)}</span></div>
    <div class="kv"><span>Proposed stake</span><span class="mono">${num(d.proposed_stake)}</span></div>
    <div class="kv"><span>Expires</span><span class="mono">${esc(d.proposed_expiration_time_utc)}</span></div>
    <div class="kv"><span>Model</span><span class="mono">${esc(d.model_version)} · cutoff ${esc(d.training_cutoff_utc)}</span></div>
    ${ss ? `<div class="horizon__strength"><span class="label">Signal strength (NOT a probability) · ${esc(ss.methodology_version)}</span>
      <div class="meter"><div class="meter__fill" style="width:${ss.signal_strength_0_to_100}%"></div></div>
      <div class="meter__caption">${ss.signal_strength_0_to_100}/100 toward ${esc(ss.strength_direction)} — alignment score only; never passes a gate</div></div>${contrib}` : ""}
    ${d.abstention_reasons.length ? `<ul class="horizon__reasons">${d.abstention_reasons.map(r => `<li>${esc(r)}</li>`).join("")}</ul>` : ""}
  </section>`;
}

function renderRun() {
  const runs = STATE.historical_runs.concat(STATE.forward_paper_runs);
  $("#tabs").innerHTML = runs.map((r, i) => `<button class="tabs__tab${i === RUN ? " tabs__tab--active" : ""}" data-i="${i}">${esc(r.data_mode)} · ${esc(r.label)}</button>`).join("");
  $("#tabs").querySelectorAll(".tabs__tab").forEach(b => b.onclick = () => { RUN = +b.dataset.i; renderRun(); });
  const r = runs[RUN]; if (!r) { $("#run").innerHTML = `<p class="empty">${esc(STATE.forward_paper_note)}</p>`; return; }
  const a = r.account, risk = r.risk;
  const tile = (k, v, cls = "") => `<div class="tiles__tile"><div class="label">${k}</div><div class="tiles__value ${cls}">${v}</div></div>`;
  const perf = Object.entries(r.performance).map(([h, p]) => [h === "combined" ? "combined" : h + "m", p.settled, p.wins, p.losses, p.ties, pct(p.hit_rate), num(p.booked_pnl), pct(p.return_on_stake)]);
  const cal = Object.entries(r.calibration).map(([k, c]) => [esc(k), badge(c.status), c.n_validation, num(c.brier, 4), num(c.brier_base_rate, 4), num(c.ece, 3), c.gate_n,
    c.gate_mean_predicted === null ? "—" : num(c.gate_mean_predicted, 3), c.gate_wilson95 ? c.gate_wilson95.map(v => num(v, 3)).join("–") : "—", esc((c.status_reasons || []).join("; "))]);
  const oc = r.open_contracts.map(c => [esc(c.contract_id), esc(c.direction), num(c.stake), num(c.strike, 4), esc(c.expiration_time), num(c.worst_case_loss)]);
  const al = r.alerts.map(x => [esc(x.contract_id), num(x.reference_stop, 4), num(x.reference_target, 4), num(x.break_even_marker, 4), esc(x.crossed.join(", ") || "none")]);
  $("#run").innerHTML = `
  ${r.warnings.length ? `<div class="banner"><strong>Warnings</strong><ul class="banner__list">${r.warnings.map(w => `<li>${esc(w)}</li>`).join("")}</ul></div>` : ""}
  <section class="panel"><div class="panel__head"><h2 class="panel__title">Paper account · ${esc(r.data_mode)}</h2><span class="label">${esc(r.data_source)}</span></div>
    <div class="tiles">${tile("Settled equity", num(a.settled_equity))}${tile("Available cash", num(a.available_cash))}${tile("Reserved (open stake)", num(a.reserved_stake))}
    ${tile("Realized P&L", num(a.realized_pnl), a.realized_pnl >= 0 ? "tiles__value--up" : "tiles__value--dn")}${tile("Realized today", num(a.realized_today))}
    ${tile("Open contracts", a.open_contract_count)}${tile("Worst-case open loss", num(a.worst_case_open_loss), "tiles__value--dn")}
    ${tile("High-water mark", num(a.high_water_mark))}${tile("Drawdown / max", num(a.drawdown) + " / " + num(a.max_drawdown))}
    ${tile("Hypothetical exit P&L (not booked)", num(a.hypothetical_early_exit_pnl_not_booked))}${tile("Ledger chain", a.chain_ok ? "verified" : "BROKEN", a.chain_ok ? "tiles__value--up" : "tiles__value--dn")}</div></section>
  <div class="desk__grid">${[3, 5, 15].map(h => horizon(h, r.latest_by_horizon[h])).join("")}</div>
  <div class="desk__grid">
    <section class="panel"><div class="panel__head"><h2 class="panel__title">Account-level controls</h2>${badge(risk.entries_blocked ? "ENTRIES BLOCKED" : "OK")}</div>
      ${Object.keys(risk.halts).length ? table(["Latched halt", "Since", "Reason"], Object.entries(risk.halts).map(([k, v]) => [esc(k), esc(v.since), esc(v.reason)])) : `<p class="empty">No latched halts.</p>`}
      <div class="kv"><span>Daily profit pause</span>${badge(risk.profit_paused ? "PAUSED" : "OK")}</div>
      <p class="panel__note">Halts block new entries only; open contracts run to settlement under their own rules.</p>
      <div class="label label--spaced">Drawdown and risk-halt timeline</div>
      ${risk.timeline.length ? `<ul class="timeline">${risk.timeline.map(e => `<li class="timeline__item mono">${esc(e.time_utc)} · ${esc(e.event)} · ${esc(e.halt)} — ${esc(e.reason || "")}</li>`).join("")}</ul>` : `<p class="empty">No events.</p>`}</section>
    <section class="panel"><div class="panel__head"><h2 class="panel__title">Settlement-based equity</h2><span class="label">max DD ${num(a.max_drawdown)}</span></div>${curve(r.equity_curve, a.initial_virtual_balance)}
      <p class="panel__note">Only booked settlements. Hypothetical early-exit P&L is excluded.</p></section>
  </div>
  <section class="panel"><div class="panel__head"><h2 class="panel__title">Open contracts · worst-case exposure</h2><span class="label">exits: ${r.exit_capability.early_exit_supported ? "EXECUTABLE (verified)" : "UNSUPPORTED — reference alerts only"}</span></div>
    ${oc.length ? table(["Contract", "Dir", "Stake", "Strike", "Expires", "Worst case"], oc, [2, 3, 5]) : `<p class="empty">No open contracts.</p>`}
    <div class="label label--spaced">ANALYTICAL ALERT — NOT AN EXECUTABLE CONTRACT EXIT</div>
    ${al.length ? table(["Contract", "Ref stop", "Ref target", "Break-even marker", "Crossed"], al, [1, 2, 3]) : `<p class="empty">No active reference alerts.</p>`}
    <p class="panel__note">Exit evidence: ${esc(r.exit_capability.evidence)}</p></section>
  <section class="panel"><div class="panel__head"><h2 class="panel__title">Performance by horizon (${esc(r.data_mode)})</h2><span class="label">not combined with other modes</span></div>
    ${perf.length ? table(["Horizon", "Settled", "Wins", "Losses", "Ties", "Hit rate", "Booked P&L", "Return on stake"], perf, [1, 2, 3, 4, 5, 6, 7]) : `<p class="empty">No settled contracts.</p>`}
    <p class="panel__note">Historical replay results are not forward evidence. ${esc(STATE.forward_paper_note || "")}</p></section>
  <section class="panel"><div class="panel__head"><h2 class="panel__title">Calibration diagnostics (held-out validation split)</h2></div>
    ${table(["Model / direction", "Status", "n", "Brier", "Base Brier", "ECE", "Gate n", "Gate mean p", "Gate Wilson 95%", "Reasons"], cal, [2, 3, 4, 5, 6, 7])}</section>`;
}

function renderQuantum() {
  const q = STATE.quantum, b = STATE.quantum_benchmark;
  if (!q) { $("#quantum").innerHTML = `<p class="empty">No quantum section.</p>`; return; }
  const jobs = q.hardware_jobs.map(j => [esc(j.backend_name), esc(j.job_id), esc((j.circuit_hash || "").slice(0, 16)), j.shots, esc(j.submitted_utc), esc(j.completed_utc), esc(JSON.stringify(j.usage_estimate)), esc(j.status)]);
  const bm = b ? Object.entries(b.models).map(([k, m]) => [esc(k), num(m.accuracy, 3), num(m.auc, 3), num(m.brier, 4), esc(m.provenance ? m.provenance.backend_name : "classical")]) : [];
  $("#quantum").innerHTML = `<div class="panel__head"><h2 class="panel__title">IBM Quantum · backend and job provenance</h2>${badge(q.status)}</div>
    <div class="kv"><span>Channel / backend</span><span class="mono">${esc(q.config.channel)} · ${esc(q.config.backend_name || "none selected")}</span></div>
    <div class="kv"><span>Credentials configured</span><span class="mono">${q.config.api_key_configured ? "yes" : "no"} (values never shown)</span></div>
    <div class="kv"><span>Hardware jobs completed</span><span class="mono">${q.hardware_jobs_completed}</span></div>
    <div class="kv"><span>Submission blockers</span><span class="mono">${esc(q.submission_blockers.join("; ") || "none")}</span></div>
    ${q.last_error ? `<div class="kv"><span>Last error</span><span class="mono">${esc(q.last_error)}</span></div>` : ""}
    <p class="panel__note">${esc(q.note)}</p>
    ${jobs.length ? table(["Backend", "Job ID", "Circuit hash", "Shots", "Submitted", "Completed", "Usage est.", "Status"], jobs) : `<p class="empty">No hardware jobs. Nothing has run on IBM hardware.</p>`}
    ${b ? `<div class="label label--spaced">Fidelity-kernel benchmark · h=${b.horizon}m · train ${b.n_train} / test ${b.n_test} · identical chronological split</div>
      ${table(["Model", "Accuracy", "AUC", "Brier", "Backend"], bm, [1, 2, 3])}<p class="panel__note">${esc(b.verdict)} Confidence bonus for quantum: ${b.confidence_bonus_for_quantum}.</p>` : ""}`;
}

function render(state) {
  STATE = state; RUN = 0;
  $("#honesty").className = "banner banner--info";
  $("#honesty").innerHTML = `<strong>PAPER ONLY.</strong><ul class="banner__list">${state.honesty.map(h => `<li>${esc(h)}</li>`).join("")}
    ${Object.entries(state.capability_status).map(([k, v]) => `<li><span class="mono">${esc(k)}</span>: ${esc(v)}</li>`).join("")}</ul>`;
  $("#sub").textContent = `${state.historical_runs.length} historical run(s) · ${state.forward_paper_runs.length} forward paper run(s)`;
  renderRun(); renderQuantum();
}

$("#load").onclick = () => $("#file").click();
$("#file").onchange = e => { const f = e.target.files[0]; if (f) f.text().then(t => render(JSON.parse(t))); };
$("#theme").onclick = () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === "light" ? "dark" : "light"; };
fetch("state.json").then(r => r.ok ? r.json() : Promise.reject()).then(render).catch(() => {});
</script>
</body>
</html>
